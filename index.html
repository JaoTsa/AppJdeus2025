<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca na Lista Excel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      text-align: center;
    }
    input[type="file"], input[type="text"] {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      max-width: 400px;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
    .results {
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Buscar itens de uma lista Excel</h1>
    <input type="file" id="excelFile" accept=".xls, .xlsx">
    <input type="text" id="searchBar" placeholder="Digite para buscar..." disabled>
    <div class="results" id="results"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
